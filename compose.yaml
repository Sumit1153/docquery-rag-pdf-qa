services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docquery
      POSTGRES_PASSWORD: docquery
      POSTGRES_DB: docquery
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docquery -d docquery"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docquery:docquery@db:5432/docquery
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
